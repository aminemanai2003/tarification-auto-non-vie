name: R reproducibility

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: renv
          extra-repositories: https://cas.uqam.ca/pub

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          dependencies: '"hard"'

      - name: Run analysis pipeline
        run: Rscript R/run_all.R

      - name: Render report
        run: Rscript R/render_report.R

      - name: Check deterministic generated artifacts
        run: git diff --exit-code -- output/tables rapport/rapport.md

      - name: Check figure generation
        shell: bash
        run: |
          expected="$(git ls-files 'output/figures/*.png' | wc -l)"
          generated="$(find output/figures -maxdepth 1 -type f -name '*.png' | wc -l)"
          test "$generated" -eq "$expected"
